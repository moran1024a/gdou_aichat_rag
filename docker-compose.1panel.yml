services:
  gdou-aichat-rag:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: gdou-aichat-rag
    restart: unless-stopped
    ports:
      # 仅监听服务器本机；1Panel反向代理或其他外部访问配置不在本编排范围内。
      - "127.0.0.1:8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?请设置 SECRET_KEY}
      RAG_ADMIN_USERNAME: ${RAG_ADMIN_USERNAME:-admin}
      RAG_ADMIN_PASSWORD: ${RAG_ADMIN_PASSWORD:?请设置 RAG_ADMIN_PASSWORD}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    volumes:
      - ./data/db.sqlite3:/app/db.sqlite3
      - ./data/rag_databases:/app/rag_databases
      - ./data/chroma_db:/app/chroma_db
      - ./data/bm25:/app/bm25
      - ./data/uploads:/app/uploads
    command: >-
      sh -c "python manage.py migrate --noinput &&
      gunicorn --bind 0.0.0.0:8000 --workers 1 --threads 1
      --timeout 300 server.wsgi:application"
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
